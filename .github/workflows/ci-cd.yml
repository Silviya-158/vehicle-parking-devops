name: ParkFlow CI/CD Pipeline

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_production:
        description: 'Deploy to EC2 production environment after CI checks pass'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1 – Frontend Build & Bundle Validation
  # ============================================================================
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend production bundle
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # Job 2 – Backend Build and Tests
  # ============================================================================
  backend-ci:
    name: Backend Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run backend tests
        working-directory: backend
        run: mvn clean test

      - name: Package backend JAR
        working-directory: backend
        run: mvn package -DskipTests

  # ============================================================================
  # Job 3 – Docker Compose Validation
  # ============================================================================
  docker-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "Docker Compose configuration is valid."

  # ============================================================================
  # Job 4 – Production Deployment (Manual Approval Gate via workflow_dispatch)
  # ============================================================================
  deploy:
    name: Production Deployment
    needs: [frontend-build, backend-ci, docker-validation]
    runs-on: ubuntu-latest
    # Pushes and pull requests must NEVER trigger deployment automatically.
    # Deployment runs ONLY via manual workflow_dispatch when deploy_to_production is true.
    if: github.event_name == 'workflow_dispatch' && (inputs.deploy_to_production == true || github.event.inputs.deploy_to_production == 'true')
    environment:
      name: production
      url: http://32.236.126.38

    steps:
      - name: Configure Verified SSH Known Hosts
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Set up private key
          echo "$SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          # Independently verified and pinned host-key verification
          if [ -z "$HOST_KEY" ]; then
            echo "ERROR: Secret EC2_HOST_KEY is missing! Pinned host-key verification is strictly required."
            echo "Please add the pinned EC2 public host key to GitHub Repository Secrets as EC2_HOST_KEY."
            exit 1
          fi

          echo "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "[PASS] Independently verified host key loaded into known_hosts."

      - name: Deploy to EC2 via SSH
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          PORT: ${{ secrets.EC2_PORT || '22' }}
        run: |
          ssh -o StrictHostKeyChecking=yes -p "$PORT" -i ~/.ssh/ec2_key "$USER@$HOST" '
            set -euo pipefail

            echo "=================================================="
            echo "Starting ParkFlow Deployment on EC2"
            echo "=================================================="

            cd /home/ec2-user/vehicle-parking-devops

            # 1. Verify and preserve existing production .env file
            if [ ! -f .env ]; then
              echo "ERROR: Production .env file is missing in /home/ec2-user/vehicle-parking-devops!"
              echo "Aborting deployment to avoid running unconfigured application."
              exit 1
            fi
            echo "[PASS] Production .env file is present and preserved."

            # 2. Check for unexpected tracked or untracked changes before repository reset
            LOCAL_CHANGES=$(git status --porcelain)
            if [ -n "$LOCAL_CHANGES" ]; then
              echo "=================================================="
              echo "ABORTING DEPLOYMENT: Unexpected local modifications found on EC2:"
              echo "$LOCAL_CHANGES"
              echo "=================================================="
              echo "Deployment aborted to protect local working tree."
              exit 1
            fi
            echo "[PASS] Working directory is clean of unexpected tracked and untracked modifications."

            # 3. Pull latest code from main
            echo "Fetching and synchronizing with origin/main..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            # 4. Rebuild ONLY application images (frontend & backend)
            echo "Building application container images (frontend and backend)..."
            docker compose build frontend backend

            # 5. Update ONLY frontend and backend containers (PostgreSQL, Prometheus, and Grafana remain untouched)
            echo "Restarting frontend and backend services..."
            docker compose up -d frontend backend

            # 6. Post-deployment Health Checks
            echo "Running deployment health checks..."

            # Backend Health Check
            echo "Checking Backend health endpoint (http://localhost:8081/api/health)..."
            BACKEND_HEALTHY=0
            for i in $(seq 1 30); do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/health || true)
              if [ "$HTTP_STATUS" -eq 200 ]; then
                echo "SUCCESS: Backend health endpoint returned HTTP 200 (attempt ${i})."
                BACKEND_HEALTHY=1
                break
              fi
              echo "Waiting for Backend to become ready... (attempt ${i}/30, status: ${HTTP_STATUS})"
              sleep 2
            done

            if [ "$BACKEND_HEALTHY" -ne 1 ]; then
              echo "ERROR: Backend health check failed or timed out!"
              docker compose logs --tail 50 backend
              exit 1
            fi

            # Frontend Health Check
            echo "Checking Frontend web server (http://localhost:80/)..."
            FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/ || true)
            if [ "$FRONTEND_STATUS" -eq 200 ]; then
              echo "SUCCESS: Frontend web server returned HTTP 200."
            else
              echo "WARNING: Frontend returned HTTP ${FRONTEND_STATUS}"
            fi

            # API via Nginx Proxy Health Check
            echo "Checking Backend via Nginx proxy (http://localhost:80/api/health)..."
            PROXY_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/api/health || true)
            if [ "$PROXY_STATUS" -eq 200 ]; then
              echo "SUCCESS: Nginx API reverse proxy returned HTTP 200."
            else
              echo "WARNING: Nginx API proxy returned HTTP ${PROXY_STATUS}"
            fi

            # Container Status Overview
            echo "=================================================="
            echo "Container Status Summary:"
            docker compose ps
            echo "=================================================="
            echo "ParkFlow Deployment Completed Successfully!"
          '
